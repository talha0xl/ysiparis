<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Menü · Yavuztürk Süleymaniye</title>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --yesil:#0f766e; --yesil-acik:#e2f0ed; --zemin:#f6f5f1; --kart:#fff; --yazi:#1c2624; --soluk:#6b7773;
      --cizgi:#ebe9e2; --kirmizi:#c2413a; --ease:cubic-bezier(.2,.7,.2,1);
      --golge:0 1px 2px rgba(28,38,36,.04),0 6px 18px rgba(28,38,36,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root { --yesil:#2fa597; --yesil-acik:#12332f; --zemin:#0e1514; --kart:#162120; --yazi:#e6eeec; --soluk:#8fa09c; --cizgi:#223130; --kirmizi:#f07167; --golge:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.28); }
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { scroll-behavior:smooth; }
    html,body { margin:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--zemin); color:var(--yazi); line-height:1.4; -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 1; }

    /* üst: yumuşak renk geçişli karşılama */
    .ust { position:relative; overflow:hidden; text-align:center; color:#fff; padding:calc(env(safe-area-inset-top,0px) + 38px) 20px 52px;
           background:radial-gradient(520px 260px at 85% -20%, rgba(255,255,255,.22), transparent 60%), radial-gradient(420px 260px at 0% 120%, rgba(237,161,0,.28), transparent 60%), linear-gradient(160deg,#0f766e,#0b5a54); }
    .ust .rozet { display:inline-block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; opacity:.85; margin-bottom:10px; }
    .ust h1 { margin:0; font-size:28px; font-weight:800; letter-spacing:-.02em; }
    .ust p { margin:8px auto 0; max-width:420px; font-size:14.5px; opacity:.88; }
    .masa-rozet { display:inline-block; margin-top:14px; background:rgba(255,255,255,.16); backdrop-filter:blur(6px); padding:6px 14px; border-radius:999px; font-size:13px; font-weight:700; }
    .ust::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:26px; background:var(--zemin); border-radius:26px 26px 0 0; }

    /* kategori şeridi + arama */
    .bar { position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--zemin) 88%, transparent); backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4); border-bottom:1px solid transparent; transition:border-color .25s, box-shadow .25s; }
    .bar.kaydi { border-bottom-color:var(--cizgi); box-shadow:0 6px 18px -12px rgba(0,0,0,.25); }
    .bar-ic { max-width:720px; margin:0 auto; padding:8px 14px; display:flex; gap:8px; align-items:center; }
    .cipler { flex:1; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px 0; }
    .cipler::-webkit-scrollbar { display:none; }
    .cip { flex:none; padding:8px 15px; border-radius:999px; background:var(--kart); border:1px solid var(--cizgi); font-weight:650; font-size:14px; white-space:nowrap; color:var(--yazi); cursor:pointer; font-family:inherit; transition:background-color .25s var(--ease), color .25s, border-color .25s, transform .15s; }
    .cip:active { transform:scale(.96); }
    .cip.aktif { background:var(--yesil); color:#fff; border-color:var(--yesil); }
    .ara-btn { flex:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--cizgi); background:var(--kart); color:var(--soluk); font-size:16px; cursor:pointer; }
    .arama { max-width:720px; margin:0 auto; padding:0 14px; overflow:hidden; max-height:0; opacity:0; transition:max-height .3s var(--ease), opacity .3s, padding .3s; }
    .arama.ac { max-height:60px; opacity:1; padding-bottom:10px; }
    .arama input { width:100%; border:1px solid var(--cizgi); background:var(--kart); color:var(--yazi); border-radius:14px; padding:11px 14px; font:inherit; outline:none; transition:border-color .2s, box-shadow .2s; }
    .arama input:focus { border-color:var(--yesil); box-shadow:0 0 0 4px color-mix(in srgb, var(--yesil) 14%, transparent); }

    main { max-width:720px; margin:0 auto; padding:4px 14px 44px; }
    .kat { scroll-margin-top:68px; animation:gir .55s var(--ease) both; }
    .kat-ad { display:flex; align-items:baseline; gap:10px; font-size:21px; font-weight:800; letter-spacing:-.02em; margin:26px 2px 10px; }
    .kat-ad small { font-size:12.5px; font-weight:600; color:var(--soluk); letter-spacing:0; }
    .liste { background:var(--kart); border-radius:20px; box-shadow:var(--golge); border:1px solid var(--cizgi); overflow:hidden; }
    .urun { display:flex; justify-content:space-between; align-items:baseline; gap:14px; padding:15px 18px; border-bottom:1px solid var(--cizgi); transition:background-color .2s; }
    .urun:last-child { border-bottom:0; }
    .urun .ad { font-weight:650; font-size:16px; }
    .urun .nokta { flex:1; align-self:flex-end; border-bottom:2px dotted color-mix(in srgb, var(--soluk) 35%, transparent); margin:0 2px 5px; min-width:12px; }
    .urun .fiyat { font-weight:800; white-space:nowrap; color:var(--yesil); font-size:16px; }
    .urun.fotolu { align-items:center; padding:12px 14px; }
    .urun.fotolu .nokta { align-self:center; margin-bottom:0; }
    .urun .foto { width:64px; height:64px; flex:none; border-radius:14px; object-fit:cover; background:var(--cizgi); }
    .logo-yer:empty { display:none; }
    .logo-yer img { display:block; margin:0 auto 14px; max-width:250px; max-height:110px; border-radius:16px; background:#fff; padding:10px 14px; box-shadow:0 6px 20px rgba(0,0,0,.18); }
    .urun.yok .ad, .urun.yok .fiyat { opacity:.45; text-decoration:line-through; }
    .tukendi { display:inline-block; margin-left:0; font-size:11px; font-weight:800; color:var(--kirmizi); background:color-mix(in srgb, var(--kirmizi) 12%, transparent); padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em; text-decoration:none; vertical-align:middle; }
    .dip { text-align:center; color:var(--soluk); font-size:13.5px; padding:34px 10px 6px; }
    .dip .garson { display:inline-flex; align-items:center; gap:8px; background:var(--yesil-acik); color:var(--yesil); padding:9px 16px; border-radius:999px; font-weight:700; }
    .dip .imza { margin-top:12px; font-size:12px; opacity:.8; }
    .bos,.hata { text-align:center; color:var(--soluk); padding:50px 20px; }
    .hata b { color:var(--kirmizi); }
    .yukleniyor { padding:30px 14px; max-width:720px; margin:0 auto; }
    .iskelet { height:54px; border-radius:16px; margin-bottom:10px; background:linear-gradient(90deg, var(--cizgi) 25%, color-mix(in srgb, var(--cizgi) 40%, var(--kart)) 50%, var(--cizgi) 75%); background-size:200% 100%; animation:parla 1.3s infinite linear; }
    @keyframes parla { to { background-position:-200% 0; } }
    @keyframes gir { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <div id="kok"><div class="ust"><div class="rozet">Menü</div><h1>&nbsp;</h1></div><div class="yukleniyor"><div class="iskelet"></div><div class="iskelet"></div><div class="iskelet"></div></div></div>
  <script src="supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
  (function () {
    'use strict';
    var A = window.ADISYON_AYAR || {};
    var kok = document.getElementById('kok');
    var masa = new URLSearchParams(location.search).get('masa');
    var arama = '';
    function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function para(n){return (Math.round((Number(n)||0)*100)/100).toLocaleString('tr-TR',{minimumFractionDigits:0,maximumFractionDigits:2})+' ₺';}
    function norm(s){return String(s||'').toLocaleLowerCase('tr-TR');}
    if (!A.SUPABASE_URL || /PROJE-KODUN/.test(A.SUPABASE_URL) || !window.supabase) {
      kok.innerHTML='<div class="hata"><b>Menü ayarlanmamış.</b><br>config.js dosyasını doldurun.</div>'; return;
    }
    var db = window.supabase.createClient(A.SUPABASE_URL, A.SUPABASE_KEY, { auth:{persistSession:false} });
    var veri = null, ilk = true, aramaAcik = false;
    var gor = { logo:null, logo_v:null, urunler:{} }, gorYukleniyor = false;
    function logoHtml(){ return '<img alt="" src="'+(gor.logo && /^data:image\//.test(gor.logo) ? gor.logo : 'logo.png')+'">'; }
    function fotoVar(u){ var g = u.id && gor.urunler[u.id]; return u.f && g && g.v === u.f && /^data:image\//.test(g.d) ? g.d : ''; }
    function gorselKontrol(){
      var eksik = (veri.logo_v || null) !== (gor.logo_v || null);
      (veri.kategoriler||[]).forEach(function(c){ (c.urunler||[]).forEach(function(u){ if (u.f && !fotoVar(u)) eksik = true; }); });
      if (!eksik || gorYukleniyor) return;
      gorYukleniyor = true;
      db.rpc('ads_menu_gorseller').then(function(r){
        gorYukleniyor = false; if (r.error || !r.data) return;
        gor = { logo:r.data.logo || null, logo_v:veri.logo_v || null, urunler:r.data.urunler || {} };
        var y = document.getElementById('logo-yer'); if (y) y.innerHTML = logoHtml();
        if (document.getElementById('govde')) yenidenListele();
      }).catch(function(){ gorYukleniyor = false; });
    }

    function govdeHtml() {
      var q = norm(arama);
      var kats = (veri.kategoriler || []).map(function(c){
        var u = (c.urunler||[]).filter(function(x){ return !q || norm(x.ad).indexOf(q) >= 0 || norm(c.ad).indexOf(q) >= 0; });
        return { ad:c.ad, urunler:u };
      }).filter(function(c){ return c.urunler.length; });
      if (!kats.length) return '<div class="bos">' + (q ? 'Aradığınız ürün bulunamadı.' : 'Menü hazırlanıyor.') + '</div>';
      return kats.map(function(c,i){
        return '<section class="kat" id="kat'+i+'" style="animation-delay:'+(ilk? i*70 : 0)+'ms"><div class="kat-ad">'+esc(c.ad)+'<small>'+c.urunler.length+' çeşit</small></div><div class="liste">'+
          c.urunler.map(function(u){
            var ft = fotoVar(u);
            return '<div class="urun'+(u.yok?' yok':'')+(ft?' fotolu':'')+'">'+(ft?'<img class="foto" alt="" loading="lazy" src="'+ft+'">':'')+'<span class="ad">'+esc(u.ad)+'</span><span class="nokta"></span>'+(u.yok?'<span class="tukendi">Tükendi</span>':'')+'<span class="fiyat">'+para(u.fiyat)+'</span></div>';
          }).join('') + '</div></section>';
      }).join('');
    }
    function cipHtml() {
      return (veri.kategoriler||[]).map(function(c,i){ return '<button class="cip'+(i===0?' aktif':'')+'" data-i="'+i+'">'+esc(c.ad)+'</button>'; }).join('');
    }

    function ciz() {
      var kats = veri.kategoriler || [];
      var ust = '<div class="ust"><div class="logo-yer" id="logo-yer">'+logoHtml()+'</div><div class="rozet">'+esc(veri.baslik||'Menü')+'</div><h1>'+esc(veri.isletme||'Menü')+'</h1>'+(veri.aciklama?'<p>'+esc(veri.aciklama)+'</p>':'')+(masa?'<div class="masa-rozet">'+esc(masa)+'</div>':'')+'</div>';
      if (!kats.length) { kok.innerHTML = ust + '<div class="bos">Menü hazırlanıyor.</div>'; return; }
      kok.innerHTML = ust +
        '<div class="bar" id="bar"><div class="bar-ic"><div class="cipler" id="cipler">'+cipHtml()+'</div><button class="ara-btn" id="arabtn" aria-label="Ara">🔍</button></div>'+
        '<div class="arama'+(aramaAcik?' ac':'')+'" id="arama"><input id="aranan" type="search" placeholder="Menüde ara…" value="'+esc(arama)+'" autocomplete="off"></div></div>'+
        '<main id="govde">'+govdeHtml()+'<div class="dip"><span class="garson">🛎 Sipariş için lütfen garsonu çağırın</span><div class="imza">'+esc(veri.isletme||'')+'</div></div></main>';
      baglan();
    }

    function baglan() {
      var cipler = document.getElementById('cipler'), bar = document.getElementById('bar');
      cipler.addEventListener('click', function(e){
        var b = e.target.closest('[data-i]'); if(!b) return;
        var el = document.getElementById('kat'+b.dataset.i); if (el) el.scrollIntoView({behavior:'smooth',block:'start'});
      });
      var ab = document.getElementById('arabtn'), ar = document.getElementById('arama'), inp = document.getElementById('aranan');
      ab.addEventListener('click', function(){ aramaAcik = !aramaAcik; ar.classList.toggle('ac', aramaAcik); if (aramaAcik) inp.focus(); else { arama=''; inp.value=''; yenidenListele(); } });
      inp.addEventListener('input', function(){ arama = inp.value; yenidenListele(); });
      window.onscroll = function(){
        bar.classList.toggle('kaydi', window.scrollY > 150);
        var kats = document.querySelectorAll('.kat'); var en = 0;
        var esik = Math.min(window.innerHeight * 0.4, 360);
        kats.forEach(function(el,i){ if (el.getBoundingClientRect().top <= esik) en = i; });
        if (kats.length && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) en = kats.length - 1;
        var cips = cipler.querySelectorAll('.cip');
        cips.forEach(function(x,i){ var a = (i===en); if (a !== x.classList.contains('aktif')) { x.classList.toggle('aktif', a); if (a) { var r=x.offsetLeft - cipler.clientWidth/2 + x.clientWidth/2; cipler.scrollTo({left:r,behavior:'smooth'}); } } });
      };
    }
    function yenidenListele() { document.getElementById('govde').innerHTML = govdeHtml() + '<div class="dip"><span class="garson">🛎 Sipariş için lütfen garsonu çağırın</span><div class="imza">'+esc(veri.isletme||'')+'</div></div>'; }

    var deneme = 0;
    function yukle() {
      db.rpc('ads_menu_public').then(function(r){
        if (r.error) throw r.error;
        var yeni = r.data || {};
        // arama yazılırken ya da sayfa kaydırılırken ekranı bozma: veri değişmediyse çizme
        if (veri && JSON.stringify(veri) === JSON.stringify(yeni)) { gorselKontrol(); return; }
        var degisti = !!veri; veri = yeni;
        if (degisti && document.getElementById('govde')) { yenidenListele(); document.getElementById('cipler').innerHTML = cipHtml(); }
        else { ciz(); ilk = false; }
        gorselKontrol();
      }).catch(function(){
        if (veri) return;
        // zayıf bağlantıda kendiliğinden tekrar dene
        if (deneme < 5) { deneme++; setTimeout(yukle, 700 * deneme); return; }
        kok.innerHTML='<div class="hata"><b>Menü şu an açılamıyor.</b><br>İnternet bağlantınızı kontrol edip tekrar deneyin.<br><br><button onclick="location.reload()" style="font:inherit;font-weight:700;padding:10px 18px;border-radius:12px;border:1px solid #ccc;background:#fff">Yeniden dene</button></div>';
      });
    }
    yukle();
    setInterval(yukle, 30000); // kapatılan ürün/kategori 30 sn'de yansır
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) yukle(); });
  })();
  </script>
</body>
</html>
